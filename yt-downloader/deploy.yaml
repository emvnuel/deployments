apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-downloader
  namespace: default
spec:
  selector:
    matchLabels:
      app: yt-downloader
  template:
    metadata:
      labels:
        app: yt-downloader
    spec:
      containers:
      - name: yt-downloader
        image: myawesomeapps/yt-downloader:1.0
        resources:
          limits:
            memory: "4096Mi"
            cpu: "1000m"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: yt-downloader-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: yt-downloader
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yt-downloader-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  labels:
    name: yt-downloader-ingress
spec:
  tls:
    - hosts:
      - "yt-downloader.labzzz.shop"
      secretName: "payroll-tls"
  rules:
  - host: yt-downloader.labzzz.shop
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: yt-downloader-svc
            port: 
              number: 8080 