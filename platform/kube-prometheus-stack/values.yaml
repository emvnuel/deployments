kube-prometheus-stack:
  fullnameOverride: ''
  nameOverride: ''
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 7d
      retentionSize: 5GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
      resources:
        requests:
          memory: 512Mi
          cpu: 250m
        limits:
          memory: 1Gi
          cpu: 500m
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
    service:
      type: ClusterIP
      port: 9090
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        external-dns.alpha.kubernetes.io/hostname: prometheus.gambiarra.space
        external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
      hosts:
      - prometheus.gambiarra.space
      tls:
      - secretName: prometheus-tls
        hosts:
        - prometheus.gambiarra.space
  grafana:
    enabled: true
    persistence:
      enabled: true
      storageClassName: local-path
      size: 2Gi
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        external-dns.alpha.kubernetes.io/hostname: grafana.gambiarra.space
        external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
      hosts:
      - grafana.gambiarra.space
      tls:
      - secretName: grafana-tls
        hosts:
        - grafana.gambiarra.space
    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: UTC
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
      datasources:
        enabled: true
        searchNamespace: ALL
    # -- Datasource do Loki (stack de logs em platform/loki); URL do gateway.
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.logging.svc.cluster.local
        jsonData:
          maxLines: 1000
    admin:
      existingSecret: grafana-admin
  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 100m
      # -- A configuração efetiva (rotas + receiver Telegram) NÃO vive no git:
      # -- o bot_token fica em `secrets.yaml` (gitignored), que cria o Secret
      # -- `alertmanager-telegram-config`. useExistingSecret impede o chart de
      # -- gerar o secret a partir de `alertmanager.config`. Veja
      # -- secrets.yaml.example e RUNBOOK.md.
      useExistingSecret: true
      configSecret: alertmanager-telegram-config
    service:
      type: ClusterIP
      port: 9093
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        external-dns.alpha.kubernetes.io/hostname: alertmanager.gambiarra.space
        external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
      hosts:
      - alertmanager.gambiarra.space
      tls:
      - secretName: alertmanager-tls
        hosts:
        - alertmanager.gambiarra.space
    # -- `config` removido de propósito: a config viva está no Secret
    # -- `alertmanager-telegram-config` (ver alertmanagerSpec.configSecret acima).
  nodeExporter:
    enabled: true
  # -- resources da subchart `prometheus-node-exporter` (a chave `nodeExporter`
  # -- só expõe enabled/operatingSystems; `nodeExporter.resources` era ignorada).
  # -- CPU: 25m de limit causava CPUThrottlingHigh a cada scrape; 200m dá folga
  # -- para os bursts de leitura de /proc.
  prometheus-node-exporter:
    resources:
      requests:
        memory: 16Mi
        cpu: 25m
      limits:
        memory: 64Mi
        cpu: 200m
  kubeStateMetrics:
    enabled: true
  # -- resources da subchart `kube-state-metrics` (a chave `kubeStateMetrics`
  # -- só expõe enabled; `kubeStateMetrics.resources` era ignorada). O limit
  # -- de 32Mi do values antigo derrubaria o KSM (p95 real ~33Mi).
  kube-state-metrics:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi
        cpu: 100m
  prometheusOperator:
    enabled: true
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
    admissionWebhooks:
      enabled: true
      patch:
        enabled: true
  defaultRules:
    create: true
    rules:
      alertmanager: true
      etcd: true
      configReloaders: true
      general: true
      k8s: true
      kubeApiserverAvailability: true
      kubeApiserverBurnrate: true
      kubeApiserverHistogram: true
      kubeApiserverSlos: true
      # -- k3s embute kube-controller-manager/kube-scheduler/kube-proxy no
      # -- processo único; não existem endpoints de metrics. As regras de
      # -- "down" (baseadas em absent()) disparavam crítico para sempre.
      kubeControllerManager: false
      kubelet: true
      kubeProxy: false
      kubePrometheusGeneral: true
      kubePrometheusNodeRecording: true
      kubernetesApps: true
      kubernetesResources: true
      kubernetesStorage: true
      kubernetesSystem: true
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeStateMetrics: true
      network: true
      node: true
      nodeExporterAlerting: true
      nodeExporterRecording: true
      prometheus: true
      prometheusOperator: true
  # -- Idem acima: sem endpoints no k3s, desligar os ServiceMonitors evita
  # -- alvos vazios e configuração enganosa.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

# -- ServiceMonitors extras para componentes instalados FORA deste chart
# -- (cert-manager e ArgoCD vivem fora do GitOps; ingress-nginx idem).
# -- Renderizados como objetos individuais em templates/servicemonitors.yaml —
# -- de propósito NÃO usamos `prometheus.additionalServiceMonitors` do upstream,
# -- que emite `kind: List` (ruim para o diff/apply do ArgoCD).
# -- Portas verificadas por pod IP; o Prometheus seleciona SMs cluster-wide
# -- (serviceMonitorSelector = {} = todos).
extraServiceMonitors:
  - name: cert-manager
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - cert-manager
    selector:
      matchLabels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: controller
    endpoints:
      - port: tcp-prometheus-servicemonitor
        path: /metrics
        interval: 30s
  - name: cert-manager-cainjector
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - cert-manager
    selector:
      matchLabels:
        app.kubernetes.io/name: cainjector
    endpoints:
      - port: http-metrics
        path: /metrics
        interval: 30s
  - name: cert-manager-webhook
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - cert-manager
    selector:
      matchLabels:
        app.kubernetes.io/name: webhook
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
  - name: argocd-application-controller
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - argocd
    selector:
      matchLabels:
        app.kubernetes.io/name: argocd-metrics
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
  - name: argocd-server
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - argocd
    selector:
      matchLabels:
        app.kubernetes.io/name: argocd-server-metrics
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
  - name: argocd-repo-server
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - argocd
    selector:
      matchLabels:
        app.kubernetes.io/name: argocd-repo-server
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
  - name: argocd-notifications-controller
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - argocd
    selector:
      matchLabels:
        app.kubernetes.io/name: argocd-notifications-controller-metrics
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
  - name: argocd-applicationset-controller
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - argocd
    selector:
      matchLabels:
        app.kubernetes.io/name: argocd-applicationset-controller
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
  # -- O chart do ingress-nginx (instalado fora deste repo) não expõe a porta
  # -- 10254 em nenhum Service; templates/ingress-nginx-metrics-service.yaml
  # -- cria um Service só para scrape (PodMonitor com targetPort não funciona:
  # -- portas não declaradas no container não geram target).
  - name: ingress-nginx
    jobLabel: app.kubernetes.io/name
    namespaceSelector:
      matchNames:
        - ingress-nginx
    selector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/component: metrics
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
