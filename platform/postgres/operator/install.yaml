# CloudNativePG Operator Installation
# Version: 1.22.0
# Documentation: https://cloudnative-pg.io/documentation/1.22/

apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-manager
  namespace: cnpg-system
---
# Note: For production use, apply the full operator manifest:
# kubectl apply -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.22/releases/cnpg-1.22.0.yaml
#
# This file creates the namespace and service account.
# The full operator includes CRDs, RBAC, Deployment, and Webhooks.
