headlamp:
  replicaCount: 1
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      external-dns.alpha.kubernetes.io/hostname: headlamp.gambiarra.space
      external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: 50m
      nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    hosts:
    - host: headlamp.gambiarra.space
      paths:
      - path: /
        type: ImplementationSpecific
    tls:
    - secretName: headlamp-tls
      hosts:
      - headlamp.gambiarra.space
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  podSecurityContext:
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
