# Wrapper do grafana/alloy como DaemonSet de coleta de logs:
#   (1) logs de containers via /var/log/pods (todos os namespaces);
#   (2) journald dos nós (k3s, kubelet/containerd embutidos, systemd).
# Destino: Loki (platform/loki) via gateway.
# Design e decisões: docs/adr/0003-logs-centralizados.md
#
# Obs.: tudo abaixo da chave `alloy:` é o values do chart upstream (padrão dos
# wrappers do repo — ver platform/kube-prometheus-stack/values.yaml).

alloy:
  # -- CRDs do chart (monitoring.grafana.com/PodLogs) não são usados; evitamos
  # -- mexer em CRDs globais do cluster.
  crds:
    create: false

  alloy:
    # -- Sem relatório de uso anônimo.
    enableReporting: false

    configMap:
      create: true
      content: |
        // ---- Coleta de logs de containers ---------------------------------
        // Descobre pods via API do k8s, mantém só os do nó atual e aponta para
        // os arquivos de log em /var/log/pods (montado do host pelo chart).

        logging {
          level = "warn"
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            regex         = "^" + sys.env("NODE_NAME") + "$"
            action        = "keep"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }

          // Evita loop de feedback: não ingerir os logs do próprio Alloy.
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            regex         = "^alloy$"
            action        = "drop"
          }

          // Caminho do arquivo de log do container (padrão CRI do kubelet).
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
          sync_period  = "10s"
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.pipeline.receiver]
        }

        // ---- Pipeline ------------------------------------------------------

        loki.process "pipeline" {
          forward_to = [loki.write.loki.receiver]

          // Remove o cabeçalho CRI do kubelet (timestamp, stream, flag) ANTES
          // de qualquer parsing — sem isso as linhas chegam como
          // "2026-... stdout F mensagem" e o multiline do Tomcat não casa.
          stage.cri {}

          stage.static_labels {
            values = {
              cluster = "homelab",
            }
          }

          // Tomcat/JULI (sistema-estoque): junta stack traces numa única
          // entrada. Escopo no container do Tomcat — o MySQL do mesmo
          // namespace usa prefixo ISO e não deve ser agrupado.
          stage.match {
            selector = "{container=\"sistema-estoque\"}"

            stage.multiline {
              firstline     = "^\\d{2}-[A-Za-z]{3}-\\d{4} \\d{2}:\\d{2}:\\d{2}\\.\\d{3}"
              max_lines     = 400
              max_wait_time = "3s"
            }
          }
        }

        // ---- Journald (k3s/kubelet/containerd/systemd) ---------------------
        // Lê o journal do nó com `path` explícito. Requer o initContainer
        // `fix-machine-id` (ver controller.initContainers): a imagem do Alloy
        // tem /etc/machine-id vazio, e sem machine-id o sd_journal não
        // encontra o journal do host (lia 0 linhas em todos os nós).

        loki.source.journal "systemd" {
          path = "/var/log/journal"

          labels = {
            node = sys.env("NODE_NAME"),
          }

          forward_to = [loki.write.loki.receiver]
        }

        // ---- Envio para o Loki ---------------------------------------------

        loki.write "loki" {
          endpoint {
            url = "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push"
          }
        }

    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    # -- Posições de leitura persistentes por nó: sem isso o Alloy re-ingere
    # -- os logs existentes a cada restart do pod (duplicando entradas).
    storagePath: /var/lib/alloy

    mounts:
      varlog: true
      extra:
        - name: alloy-data
          mountPath: /var/lib/alloy
        # -- Machine-id do nó (ver initContainer fix-machine-id): o sd_journal
        # -- usa /etc/machine-id para localizar o journal; na imagem do Alloy
        # -- esse arquivo é vazio.
        - name: machine-id
          mountPath: /etc/machine-id
          subPath: machine-id

    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 384Mi

  controller:
    volumes:
      extra:
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
        - name: machine-id
          emptyDir: {}
    # -- O /etc/machine-id da imagem do Alloy é vazio; sem machine-id o
    # -- componente loki.source.journal lê 0 linhas (sd_journal_open usa o
    # -- machine-id local para achar o journal). Este initContainer descobre o
    # -- ID do nó (nome do diretório do journal ativo) e grava no emptyDir,
    # -- que é montado por cima de /etc/machine-id no container principal.
    # -- Sem journal ativo encontrado, grava vazio (não quebra o mount).
    initContainers:
      - name: fix-machine-id
        image: docker.io/grafana/alloy:v1.20.1
        command:
          - sh
          - -c
          - |
            id=""
            for d in /var/log/journal/*/; do
              if [ -f "$d/system.journal" ]; then
                id="${d%/}"; id="${id##*/}"
                break
              fi
            done
            printf "%s" "$id" > /machine-id/machine-id
            echo "machine-id do nó: [$id]"
        volumeMounts:
          - name: varlog
            mountPath: /var/log
            readOnly: true
          - name: machine-id
            mountPath: /machine-id

  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        # -- 50m causava CPUThrottlingHigh (info) no container do reloader.
        cpu: 250m
        memory: 64Mi

  # -- Métricas internas do Alloy (loki_source_file_*, loki_write_*) no
  # -- Prometheus (SM pego pelo selector vazio do Prometheus CR).
  serviceMonitor:
    enabled: true
