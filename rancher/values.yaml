# Rancher Configuration
# Hostname for Rancher UI
hostname: rancher.awesomeapps.cloud

# Rancher replica count
replicas: 1

# Bootstrap password (change after first login)
# If not set, Rancher will generate one
bootstrapPassword: ""

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: nginx
  tls:
    # Use cert-manager for TLS certificates
    source: letsEncrypt
  annotations:
    # External DNS annotation for automatic DNS record creation
    external-dns.alpha.kubernetes.io/hostname: rancher.awesomeapps.cloud
    # Cert-manager annotation for automatic certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Nginx specific annotations
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"

# Let's Encrypt configuration
letsEncrypt:
  enabled: true
  email: admin@awesomeapps.cloud
  environment: production
  # Use letsencrypt-prod cluster issuer
  ingress:
    class: nginx

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Liveness and readiness probes
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30

# Use system default registry
systemDefaultRegistry: ""

# Additional trusted CAs
# privateCA: false

# Anti-affinity for pod distribution
antiAffinity: preferred

# Audit log configuration
auditLog:
  level: 0
  maxAge: 10
  maxBackup: 10
  maxSize: 100

# Global settings
global:
  cattle:
    psp:
      enabled: false
