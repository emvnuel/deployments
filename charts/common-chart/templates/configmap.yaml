{{- if and (not .Values.configMap.enabled) .Values.configMap.data -}}
{{- fail "configMap.data is set but configMap.enabled is false; set configMap.enabled=true or remove the data" -}}
{{- end -}}
{{- if .Values.configMap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common-chart.configMapName" . }}
  labels:
    {{- include "common-chart.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.configMap.data | nindent 2 }}
{{- end }}
