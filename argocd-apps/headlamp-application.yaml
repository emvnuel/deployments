apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.39.0
    chart: headlamp
    
    helm:
      values: |
        replicaCount: 1
        
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            external-dns.alpha.kubernetes.io/hostname: headlamp.awesomeapps.cloud
            external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/proxy-body-size: "50m"
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          hosts:
            - host: headlamp.awesomeapps.cloud
              paths:
                - path: /
                  type: ImplementationSpecific
          tls:
            - secretName: headlamp-tls
              hosts:
                - headlamp.awesomeapps.cloud
        
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        
        podSecurityContext:
          fsGroup: 101
          seccompProfile:
            type: RuntimeDefault
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
  
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
