# Kube Prometheus Stack Configuration
# This configuration sets up Prometheus, Grafana, and Alertmanager for cluster monitoring

# Global settings
fullnameOverride: ""
nameOverride: ""

# Prometheus Configuration
prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d
    retentionSize: 5GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "local-path"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
  service:
    type: ClusterIP
    port: 9090
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      external-dns.alpha.kubernetes.io/hostname: prometheus.gambiarra.space
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    hosts:
      - prometheus.gambiarra.space
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.gambiarra.space

# Grafana Configuration
grafana:
  enabled: true
  adminPassword: admin
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: 2Gi
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      external-dns.alpha.kubernetes.io/hostname: grafana.gambiarra.space
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    hosts:
      - grafana.gambiarra.space
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.gambiarra.space
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: UTC
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      searchNamespace: ALL

# Alertmanager Configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "local-path"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
  service:
    type: ClusterIP
    port: 9093
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      external-dns.alpha.kubernetes.io/hostname: alertmanager.gambiarra.space
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    hosts:
      - alertmanager.gambiarra.space
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.gambiarra.space
  config:
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alertmanager@gambiarra.space'
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'default'
      routes:
      - matchers:
        - alertname = "Watchdog"
        receiver: "null"
    receivers:
    - name: 'default'
    - name: 'null'

# Node Exporter Configuration
nodeExporter:
  enabled: true
  resources:
    requests:
      memory: 16Mi
      cpu: 10m
    limits:
      memory: 32Mi
      cpu: 25m

# Kube State Metrics Configuration
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      memory: 16Mi
      cpu: 5m
    limits:
      memory: 32Mi
      cpu: 10m

# Prometheus Operator Configuration
prometheusOperator:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

# Default Rules Configuration
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Service Monitor for additional services
additionalServiceMonitors: []

# Pod Monitor for additional pods
additionalPodMonitors: []

# Additional PrometheusRules
additionalPrometheusRules: []
