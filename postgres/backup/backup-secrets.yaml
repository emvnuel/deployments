# Backup Secrets
# These credentials are for S3-compatible object storage
# Replace with your actual credentials
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-credentials
  namespace: postgres
type: Opaque
stringData:
  ACCESS_KEY_ID: "your-access-key-id"  # CHANGE THIS
  SECRET_ACCESS_KEY: "your-secret-access-key"  # CHANGE THIS
  # For MinIO or other S3-compatible storage
  # AWS_S3_ENDPOINT: "https://minio.example.com"
  # AWS_REGION: "us-east-1"
