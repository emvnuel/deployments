# Example: Connection pooler using PgBouncer
# Improves performance and connection management
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pooler
  namespace: postgres
spec:
  cluster:
    name: postgres-cluster
  
  # Number of pooler instances (reduced)
  instances: 2
  
  type: rw  # Read-write pooler (for primary)
  
  pgbouncer:
    # PgBouncer configuration (reduced for lighter deployment)
    poolMode: transaction  # Options: session, transaction, statement
    parameters:
      max_client_conn: "500"
      default_pool_size: "15"
      max_db_connections: "50"
      max_user_connections: "50"
      reserve_pool_size: "3"
      reserve_pool_timeout: "5"
      server_idle_timeout: "600"
      server_lifetime: "3600"
      server_connect_timeout: "15"
      query_timeout: "0"
      query_wait_timeout: "120"
  
  # High availability for pooler
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
