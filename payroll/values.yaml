nameOverride: "payroll"
replicaCount: 1
image:
  repository: "myawesomeapps/payroll"
  tag: "1.13-multiarch"
service:
  name: "payroll-svc"
  port: 8080
  targetPort: 8080
  type: ClusterIP
resources:
  limits:
    cpu: 250m
    memory: 512Mi
envFrom:
  - configMapRef:
      name: payroll-config
ingress:
  enabled: true
  hosts:
    - host: payroll.awesomeapps.cloud
      paths:
        - path: /
          pathType: Prefix
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    external-dns.alpha.kubernetes.io/hostname: payroll.awesomeapps.cloud
    external-dns.alpha.kubernetes.io/ttl: "120"
  tls:
    - hosts:
      - "payroll.awesomeapps.cloud"
      secretName: "payroll-tls"

configMap:
  enabled: true
  name: "payroll-config"
  data:
    INSS_RANGES: '[{"index":1,"aliquot":0.075,"init_value":1518,"end_value":1518},{"index":2,"aliquot":0.09,"init_value":1518.01,"end_value":2793.88},{"index":3,"aliquot":0.12,"init_value":2793.89,"end_value":4190.83},{"index":4,"aliquot":0.14,"init_value":4190.84,"end_value":8157.41},{"index":5,"aliquot":0.14,"init_value":8157.42,"end_value":1000000}]'
    IRRF_RANGES: '[{"init_value":0,"end_value":2428.8,"aliquot":0,"deduction":0},{"init_value":2428.81,"end_value":2826.65,"aliquot":0.075,"deduction":182.16},{"init_value":2826.66,"end_value":3751.05,"aliquot":0.15,"deduction":394.16},{"init_value":3751.06,"end_value":4664.68,"aliquot":0.225,"deduction":675.49},{"init_value":4664.68,"end_value":1000000,"aliquot":0.275,"deduction":908.73}]'
    DEPENDENT_DEDUCTION_AMOUNT: "189.59"
    INSS_RANGE_5_DISCOUNT_AMOUNT: "951.62"
    MIN_GROSS_PAY: "1518"
