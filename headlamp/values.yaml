# Headlamp Configuration
# Modern Kubernetes UI with full cluster management capabilities

# Number of replicas
replicaCount: 1

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    # External DNS for automatic DNS record creation
    external-dns.alpha.kubernetes.io/hostname: headlamp.gambiarra.space
    # Cloudflare proxy enabled (orange cloud)
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    # Cert-manager for automatic TLS certificates
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Nginx optimizations
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: headlamp.gambiarra.space
      paths:
        - path: /
          type: ImplementationSpecific
  tls:
    - secretName: headlamp-tls
      hosts:
        - headlamp.gambiarra.space

# Resource limits
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod security context
podSecurityContext:
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 100
