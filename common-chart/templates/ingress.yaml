{{- if .Values.ingress.enabled -}}
{{- $rawHosts := splitList "," (required "ingress.hostnames is required when ingress.enabled is true" .Values.ingress.hostnames) -}}
{{- $hostnames := list -}}
{{- range $rawHosts -}}
{{- $h := trim . -}}
{{- if $h -}}
{{- $hostnames = append $hostnames $h -}}
{{- end -}}
{{- end -}}
{{- if not $hostnames -}}
{{- fail "ingress.hostnames must contain at least one host" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "common-chart.fullname" . }}
  labels:
    {{- include "common-chart.labels" . | nindent 4 }}
  annotations:
    {{- $annotations := merge (deepCopy .Values.ingress.extraAnnotations) .Values.ingress.annotations -}}
    {{- if $hostnames -}}
    {{-   $_ := set $annotations "external-dns.alpha.kubernetes.io/hostname" (join "," $hostnames) -}}
    {{- end -}}
    {{- if .Values.ingress.cloudflareProxied -}}
    {{-   $_ := set $annotations "external-dns.alpha.kubernetes.io/cloudflare-proxied" "true" -}}
    {{- end -}}
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hostnames }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "common-chart.fullname" .)) }}
  {{- end }}
  rules:
    {{- range $hostnames }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "common-chart.serviceName" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}