# Default values for common-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- The name of the application.
nameOverride: ""
# -- A more detailed name for the application.
fullnameOverride: ""

# -- Number of replicas for the deployment.
replicaCount: 1

image:
  # -- The repository of the container image.
  repository: "nginx"
  # -- The tag of the container image.
  tag: "stable"
  # -- The pull policy for the container image.
  pullPolicy: IfNotPresent

# -- Service account configuration.
serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Annotations to add to the service account.
  annotations: {}

# -- Pod security context.
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Service configuration.
service:
  # -- The name of the service.
  name: ""
  # -- The type of the service.
  type: ClusterIP
  # -- The port the service will expose.
  port: 80
  # -- The port on the container that the service should direct traffic to.
  targetPort: 80

# -- Ingress configuration.
ingress:
  # -- Specifies whether an ingress should be created.
  enabled: false
  # -- Ingress class name for the ingress.
  className: "nginx"
  # -- Comma-separated list of hostnames for the ingress.
  hostnames: "chart-example.local"
  # -- The path for the ingress.
  path: "/"
  # -- The path type for the ingress.
  pathType: "Prefix"
  # -- Default annotations that will be applied to all services.
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/ttl: "120"
  # -- Extra annotations for specific services. These will be merged with the default annotations.
  extraAnnotations: {}
  # -- Whether to enable Cloudflare proxying.
  cloudflareProxied: false
  # -- TLS configuration for the ingress.
  tls:
    # -- Specifies whether TLS should be enabled.
    enabled: false
    # -- The secret name to use for TLS. If not set, a name is generated using the fullname template.
    secretName: ""

# -- Resource requests and limits for the container.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Probes configuration. Each probe is enabled independently.
probes:
  # -- Liveness probe configuration. Any Kubernetes probe fields
  # -- (httpGet / tcpSocket / exec / grpc, timings) belong directly under `liveness:`.
  liveness:
    # -- Specifies whether the liveness probe should be created.
    enabled: false
  # -- Readiness probe configuration. Any Kubernetes probe fields
  # -- (httpGet / tcpSocket / exec / grpc, timings) belong directly under `readiness:`.
  # -- When no probe fields are given, the chart defaults to a tcpSocket check on the `http` port.
  readiness:
    # -- Specifies whether the readiness probe should be created.
    enabled: true

# -- Environment variables for the container.
env: []
# - name: FOO
#   value: "bar"

# -- Environment variables from secrets or configmaps.
envFrom: []
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: my-configmap

# -- Volume mounts for the container.
volumeMounts: []
# - name: data
#   mountPath: /data

# -- Volumes for the pod.
volumes: []
# - name: data
#   emptyDir: {}

# -- ConfigMap configuration.
configMap:
  # -- Specifies whether a configmap should be created.
  enabled: false
  # -- The name of the configmap to use.
  name: ""
  # -- Wire this ConfigMap into the container's envFrom. If enabled and configMap.enabled, the chart wires the ConfigMap it creates; if enabled with configMap.enabled=false and name set, wires that external ConfigMap by name.
  envFrom: false
  # -- Data for the configmap.
  data: {}

# -- Secret configuration. The chart references existing Secrets only; it never creates Secret payloads, keeping secret material out of values files and git.
secret:
  # -- The name of an existing Secret to wire into envFrom.
  name: ""
  # -- Wire this Secret into the container's envFrom. Requires secret.name.
  envFrom: false
