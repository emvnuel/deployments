# Default values for common-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- The name of the application.
nameOverride: ""
# -- A more detailed name for the application.
fullnameOverride: ""

# -- Number of replicas for the deployment.
replicaCount: 1

image:
  # -- The repository of the container image.
  repository: "nginx"
  # -- The tag of the container image.
  tag: "stable"
  # -- The pull policy for the container image.
  pullPolicy: IfNotPresent

# -- Service account configuration.
serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Annotations to add to the service account.
  annotations: {}

# -- Pod security context.
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Service configuration.
service:
  # -- The name of the service.
  name: ""
  # -- The type of the service.
  type: ClusterIP
  # -- The port the service will expose.
  port: 80
  # -- The port on the container that the service should direct traffic to.
  targetPort: 80

# -- Ingress configuration.
ingress:
  # -- Specifies whether an ingress should be created.
  enabled: false
  # -- The hostname for the ingress.
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  # -- The path for the ingress.
  path: "/"
  # -- The path type for the ingress.
  pathType: "Prefix"
  # -- Annotations for the ingress.
  annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # external-dns.alpha.kubernetes.io/hostname: chart-example.local.
  # -- TLS configuration for the ingress.
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Resource requests and limits for the container.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe configuration.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

# -- Readiness probe configuration.
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Environment variables for the container.
env: []
# - name: FOO
#   value: "bar"

# -- Environment variables from secrets or configmaps.
envFrom: []
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: my-configmap

# -- Volume mounts for the container.
volumeMounts: []
# - name: data
#   mountPath: /data

# -- Volumes for the pod.
volumes: []
# - name: data
#   emptyDir: {}

# -- ConfigMap configuration.
configMap:
  # -- Specifies whether a configmap should be created.
  enabled: false
  # -- The name of the configmap to use.
  name: ""
  # -- Data for the configmap.
  data: {}
