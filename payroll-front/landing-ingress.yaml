apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payroll-front-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: salario.ninja,www.salario.ninja
    external-dns.alpha.kubernetes.io/ttl: "120"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"   
  labels:
    name: payroll-front-ingress
spec:
  tls:
    - hosts:
        - "salario.ninja"
        - "www.salario.ninja"
      secretName: "payroll-front-tls"
  rules:
  - host: salario.ninja
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: payroll-front-svc
            port:
              number: 80
  - host: www.salario.ninja
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: payroll-front-svc
            port:
              number: 80
