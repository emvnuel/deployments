nameOverride: "payroll-front"
replicaCount: 1
image:
  repository: "myawesomeapps/payroll-front"
  tag: "0.1.9-SNAPSHOT"
service:
  name: "payroll-front-svc"
  port: 80
  targetPort: 3000
  type: ClusterIP
resources:
  limits:
    cpu: 100m
    memory: 512Mi
ingress:
  enabled: true
  hosts:
    - host: salario.ninja
      paths:
        - path: /
          pathType: Prefix
    - host: www.salario.ninja
      paths:
        - path: /
          pathType: Prefix
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: salario.ninja,www.salario.ninja
    external-dns.alpha.kubernetes.io/ttl: "120"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  tls:
    - hosts:
      - "salario.ninja"
      - "www.salario.ninja"
      secretName: "payroll-front-tls"
