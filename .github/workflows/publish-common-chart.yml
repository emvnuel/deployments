name: publish-common-chart

# Publica o common-chart como artefato OCI no GHCR.
# Consumidores referenciam: "oci://ghcr.io/<owner>/charts" (ver charts/common-chart/README.md).
on:
  push:
    branches: [master]
    paths:
      - "charts/common-chart/**"
      - ".github/workflows/publish-common-chart.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decidir se este push publica (somente se common-chart mudou)
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- charts/common-chart; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "charts/common-chart não mudou neste push; nada a publicar."
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          version: v3.17.1

      - name: Lint
        if: steps.decide.outputs.publish == 'true'
        run: helm lint charts/common-chart/

      - name: Login no GHCR
        if: steps.decide.outputs.publish == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package e push
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          VERSION="$(helm show chart charts/common-chart | awk '/^version:/{print $2}')"
          echo "versão: $VERSION"
          mkdir -p /tmp/chart
          helm package charts/common-chart -d /tmp/chart
          if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/common-chart" --version "$VERSION" >/dev/null 2>&1; then
            echo "::error::common-chart $VERSION já está publicado no GHCR. Suba a versão em charts/common-chart/Chart.yaml e commite novamente."
            exit 1
          fi
          helm push "/tmp/chart/common-chart-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
