name: publish-charts

# Publica charts de charts/* como artefatos OCI no GHCR.
# Consumidores referenciam: "oci://ghcr.io/<owner>/charts" (ver charts/common-chart/README.md).
#
# Descoberta dinâmica: qualquer charts/<nome>/Chart.yaml entra na matriz.
# Só publica o chart cujo diretório mudou no push e recusa sobrescrever
# versão já publicada (bump obrigatório em Chart.yaml).

on:
  push:
    branches: [master]
    paths:
      - "charts/**"
      - ".github/workflows/publish-charts.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.list.outputs.charts }}
    steps:
      - uses: actions/checkout@v4

      - name: Listar charts
        id: list
        run: |
          set -euo pipefail
          CHARTS="$(find charts -mindepth 2 -maxdepth 2 -name Chart.yaml -printf '%h\n' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "charts=$CHARTS" >> "$GITHUB_OUTPUT"
          echo "charts=$CHARTS"

  publish:
    needs: discover
    if: needs.discover.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decidir se este push publica ${{ matrix.chart }}
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Mudanças só de README não exigem bump/publicação (guard abaixo
            # continua valendo quando templates/values mudam).
            if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- "${{ matrix.chart }}" ":(exclude)${{ matrix.chart }}/README.md"; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "${{ matrix.chart }} não mudou (fora README) neste push; nada a publicar."
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          version: v3.17.1

      - name: Lint
        if: steps.decide.outputs.publish == 'true'
        run: helm lint "${{ matrix.chart }}"

      - name: Login no GHCR
        if: steps.decide.outputs.publish == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package e push
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          CHART="${{ matrix.chart }}"
          NAME="$(helm show chart "$CHART" | awk '/^name:/{print $2}')"
          VERSION="$(helm show chart "$CHART" | awk '/^version:/{print $2}')"
          echo "publicando $NAME $VERSION ($CHART)"
          mkdir -p /tmp/chart
          helm package "$CHART" -d /tmp/chart
          if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/$NAME" --version "$VERSION" >/dev/null 2>&1; then
            echo "::error::$NAME $VERSION já está publicado no GHCR. Suba a versão em $CHART/Chart.yaml e commite novamente."
            exit 1
          fi
          helm push "/tmp/chart/$NAME-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
