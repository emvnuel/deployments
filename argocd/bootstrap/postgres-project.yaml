apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: postgres
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  description: PostgreSQL database infrastructure
  destinations:
  - namespace: postgres
    server: https://kubernetes.default.svc
  - namespace: cnpg-system
    server: https://kubernetes.default.svc
  - namespace: ingress-nginx
    server: https://kubernetes.default.svc
  namespaceResourceBlacklist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: apps
    kind: DaemonSet
  - group: batch
    kind: Job
  - group: batch
    kind: CronJob
  - group: networking.k8s.io
    kind: Ingress
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: policy
    kind: PodDisruptionBudget
  - group: postgresql.cnpg.io
    kind: Cluster
  - group: postgresql.cnpg.io
    kind: Backup
  - group: postgresql.cnpg.io
    kind: ScheduledBackup
  - group: postgresql.cnpg.io
    kind: Pooler
  - group: monitoring.coreos.com
    kind: ServiceMonitor
  - group: monitoring.coreos.com
    kind: PodMonitor
  - group: monitoring.coreos.com
    kind: PrometheusRule
  roles:
  - description: Read-only access to postgres project
    groups:
    - developers
    name: read-only
    policies:
    - p, proj:postgres:read-only, applications, get, postgres/*, allow
  - description: Admin access to postgres project
    groups:
    - devops
    - platform-team
    name: admin
    policies:
    - p, proj:postgres:admin, applications, *, postgres/*, allow
  sourceRepos:
  - https://github.com/emvnuel/deployments.git
  - https://ghcr.io/cloudnative-pg/*
