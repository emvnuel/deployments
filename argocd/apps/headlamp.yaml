apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: headlamp
  namespace: argocd
spec:
  destination:
    namespace: headlamp
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: headlamp
    helm:
      valueFiles:
      - $values/headlamp/values.yaml
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.39.0
  - ref: values
    repoURL: https://github.com/emvnuel/deployments.git
    targetRevision: master
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
