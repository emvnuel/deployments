apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: landing-page
  namespace: argocd
spec:
  destination:
    namespace: landing-page
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/landing-page
    repoURL: https://github.com/emvnuel/deployments.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
