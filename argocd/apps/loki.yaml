apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: loki
  namespace: argocd
  # -- StatefulSets gerenciados diretamente pelo ArgoCD + ServerSideApply
  # -- produzem "phantom diffs" (defaults do k8s e status do volumeClaimTemplate).
  # -- O server-side diff delega a comparação ao API server e elimina o falso
  # -- OutOfSync (argo-cd#11143 / #11106).
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    namespace: logging
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/emvnuel/deployments.git
    targetRevision: HEAD
    path: platform/loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
