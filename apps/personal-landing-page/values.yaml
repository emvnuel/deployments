common-chart:
  nameOverride: "personal-landing-page"
  replicaCount: 1
  image:
    repository: "myawesomeapps/personal-landing-page"
    tag: "1.8"
  service:
    name: "personal-landing-page-svc"
    port: 80
    targetPort: 3000
    type: ClusterIP
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      # -- pico 7d: 11.5m; folga ~2x
      cpu: 25m
      # -- pico 7d: 165Mi; folga ~1.5x
      memory: 256Mi
  ingress:
    enabled: true
    hostnames: "emvnuel.tech,www.emvnuel.tech"
    cloudflareProxied: true
    tls:
      enabled: true
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      enabled: true
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
