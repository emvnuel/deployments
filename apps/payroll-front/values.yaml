common-chart:
  nameOverride: "payroll-front"
  replicaCount: 1
  image:
    repository: "myawesomeapps/payroll-front"
    tag: "2.3"
  service:
    name: "payroll-front-svc"
    port: 80
    targetPort: 3000
    type: ClusterIP
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      # -- pico 7d: 1.3m; mínimo prático
      cpu: 25m
      # -- pico 7d: 46Mi; folga ~2x
      memory: 96Mi
  configMap:
    enabled: true
    name: "payroll-front-config"
    envFrom: true
    data:
      NEXT_PUBLIC_PAYROLL_API_URL: "https://payroll.gambiarra.space/payroll"
  ingress:
    enabled: true
    hostnames: "salario.gambiarra.space,www.salario.gambiarra.space"
    cloudflareProxied: true
    tls:
      enabled: true
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      enabled: true
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
