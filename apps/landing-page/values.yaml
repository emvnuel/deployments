common-chart:
  nameOverride: "landing-page"
  replicaCount: 1
  image:
    repository: "myawesomeapps/landing-page"
    tag: "2.0"
  service:
    name: "landing-page-svc"
    port: 80
    targetPort: 8080
    type: ClusterIP
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      # -- pico 7d: 0.2m; mínimo prático (site estático)
      cpu: 25m
      # -- pico 7d: 3Mi; folga ~10x (site estático)
      memory: 32Mi
  ingress:
    enabled: true
    hostnames: "gambiarra.space,www.gambiarra.space,www1.gambiarra.space"
    cloudflareProxied: true
    tls:
      enabled: true
