common-chart:
  # -- Copilot API deployment using common-chart
  nameOverride: "copilot-api"
  replicaCount: 1

  image:
    repository: "myawesomeapps/copilot-api"
    tag: "2.0"

  service:
    name: "copilot-api-svc"
    port: 80
    targetPort: 4141
    type: ClusterIP

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      # -- pico 7d: 0.9m; mínimo prático
      cpu: 25m
      # -- pico 7d: 65Mi; folga ~2x
      memory: 128Mi

  # -- Load secrets from Kubernetes Secret
  secret:
    envFrom: true
    name: "copilot-api-secrets"

  ingress:
    enabled: true
    hostnames: "llm.gambiarra.space"
    cloudflareProxied: true
    tls:
      enabled: true
